<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/EMRALD-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMRALD Model Editor</title>
    <script>
      // Apply the saved color scheme before React mounts to avoid a light flash.
      // Keep the attribute and storage key in sync with src/theme.ts.
      (function () {
        try {
          const mode = localStorage.getItem('emrald-theme-mode') || 'system';
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-emrald-theme', mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
